[project]
name = "hwinfo"
version = "0.1.0"
description = "Windows 硬件检测工具"
requires-python = ">=3.10"
dependencies = [
    "pywin32>=306",
    "wmi>=1.5.1",
    "psutil>=5.9.0",
    "pynvml>=11.5.0",
    "PyYAML>=6.0",
    "PySide6>=6.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
